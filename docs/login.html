<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>執事登入與信眾入口 - 五公祖師巖</title>
    <script src="js/tailwindcss.js"></script>
    <script src="js/vue.global.prod.js"></script>
    <script src="js/common.js"></script>
    <style>
        [v-cloak] {
            display: none;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-amber-950 via-amber-900 to-amber-950 min-h-screen flex items-center justify-center p-4">
    <div id="app" v-cloak class="w-full max-w-md bg-white rounded-3xl shadow-2xl overflow-hidden border border-amber-800/40 animate-in fade-in zoom-in duration-300">

        <!-- 頂部古典廟徽橫幅 -->
        <div class="bg-amber-900 px-8 pt-8 pb-6 text-center text-white relative">
            <div class="inline-block p-3 rounded-2xl bg-amber-800/80 border border-amber-600/50 shadow-inner mb-3">
                <span class="text-4xl">⛩️</span>
            </div>
            <h1 class="text-xl font-black tracking-widest text-amber-200">五公祖師巖</h1>
            <p class="text-xs text-amber-300/80 font-mono mt-1">宮務智慧管理系統 ‧ 登入入口</p>
        </div>

        <!-- 主體表單區 -->
        <div class="p-8 space-y-6">

            <!-- 執事帳密登入表單 -->
            <form @submit.prevent="handleLogin" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">執事帳號</label>
                    <input v-model="username"
                           type="text"
                           placeholder="請輸入管理帳號"
                           required
                           class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-amber-800/30 focus:border-amber-800 outline-none transition-all" />
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-700 mb-1">登入密碼</label>
                    <input v-model="password"
                           type="password"
                           placeholder="請輸入密碼"
                           required
                           class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm bg-gray-50 focus:bg-white focus:ring-2 focus:ring-amber-800/30 focus:border-amber-800 outline-none transition-all" />
                </div>

                <div v-if="errorMessage" class="p-3 bg-red-50 border border-red-200 rounded-xl text-xs text-red-700 font-bold flex items-center gap-1.5">
                    <span>⚠️</span> {{ errorMessage }}
                </div>

                <button type="submit"
                        :disabled="isLoading"
                        class="w-full py-3 bg-amber-800 hover:bg-amber-900 active:scale-95 disabled:bg-gray-400 text-white font-bold text-sm rounded-xl shadow-lg shadow-amber-900/20 transition-all flex items-center justify-center gap-2">
                    <span v-if="isLoading">登入驗證中...</span>
                    <span v-else>🔑 執事人員登入</span>
                </button>
            </form>

            <!-- 訪客免密入口 -->
            <div class="text-center">
                <button type="button"
                        @click="loginAsGuest"
                        class="w-full py-2.5 bg-amber-50 hover:bg-amber-100/80 active:scale-95 border border-amber-300 text-amber-900 font-bold text-xs rounded-xl shadow-sm transition-all flex items-center justify-center gap-1.5">
                    <span>🙏</span> 訪客信眾免密參訪 (公開資訊查閱)
                </button>
            </div>

            <!-- 分隔線 -->
            <div class="relative flex items-center justify-center pt-2">
                <div class="border-t border-dashed border-gray-300 w-full"></div>
                <div class="bg-white px-3 text-[11px] text-amber-900 font-bold whitespace-nowrap">🛠️ 內部測試快捷身分</div>
            </div>

            <!-- 保留：測試快捷登入面板 -->
            <div class="p-3.5 bg-amber-50/60 rounded-2xl border border-amber-200 space-y-2">
                <p class="text-[10px] text-gray-500 text-center">點擊以下按鈕直接模擬不同執事角色登入：</p>
                <div class="grid grid-cols-2 gap-2">
                    <button type="button"
                            @click="quickLogin('ADMIN', '主委 (測試)', 'admin')"
                            class="py-2 px-2.5 bg-white hover:bg-amber-100 border border-amber-300 rounded-lg text-[11px] font-bold text-amber-950 transition-all flex items-center justify-center gap-1">
                        <span>👑</span> 主委 / 管理員
                    </button>
                    <button type="button"
                            @click="quickLogin('RITUAL', '法師 (測試)', 'ritual')"
                            class="py-2 px-2.5 bg-white hover:bg-amber-100 border border-amber-300 rounded-lg text-[11px] font-bold text-amber-950 transition-all flex items-center justify-center gap-1">
                        <span>📜</span> 科儀法師組長
                    </button>
                    <button type="button"
                            @click="quickLogin('ACCOUNTANT', '會計 (測試)', 'accountant')"
                            class="py-2 px-2.5 bg-white hover:bg-amber-100 border border-amber-300 rounded-lg text-[11px] font-bold text-amber-950 transition-all flex items-center justify-center gap-1">
                        <span>🪙</span> 會計出納執事
                    </button>
                    <button type="button"
                            @click="quickLogin('VOLUNTEER', '志工 (測試)', 'volunteer')"
                            class="py-2 px-2.5 bg-white hover:bg-amber-100 border border-amber-300 rounded-lg text-[11px] font-bold text-amber-950 transition-all flex items-center justify-center gap-1">
                        <span>🤝</span> 臨櫃服務志工
                    </button>
                </div>
            </div>

        </div>

        <!-- 底部版權 -->
        <div class="bg-gray-50 px-8 py-3 text-center border-t border-gray-100 text-[11px] text-gray-400 font-mono">
            五公祖師巖 ‧ 歲次丙午年 ‧ 宮務管理平台
        </div>

    </div>

    <script>
        const { createApp, ref } = Vue;

        createApp({
            setup() {
                const username = ref('');
                const password = ref('');
                const errorMessage = ref('');
                const isLoading = ref(false);

                // 帳密正式登入
                const handleLogin = async () => {
                    errorMessage.value = '';
                    isLoading.value = true;
                    try {
                        const res = await fetch(`${API_BASE}/auth/login`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                username: username.value.trim(),
                                password: password.value.trim()
                            })
                        });

                        const result = await res.json();
                        if (result.success) {
                            localStorage.setItem('temple_token', result.token || 'auth-token');
                            localStorage.setItem('temple_user', JSON.stringify({
                                userId: result.user?.id || result.user?.userId,
                                username: result.user?.username,
                                realName: result.user?.realName || result.user?.real_name || result.user?.username,
                                role: result.user?.role
                            }));
                            window.location.replace('index.html');
                        } else {
                            errorMessage.value = result.message || '帳號或密碼錯誤';
                        }
                    } catch (e) {
                        errorMessage.value = '伺服器連線異常，請稍後再試';
                    } finally {
                        isLoading.value = false;
                    }
                };

                // 訪客一鍵免密登入
                const loginAsGuest = () => {
                    localStorage.setItem('temple_token', 'guest-token');
                    localStorage.setItem('temple_user', JSON.stringify({
                        userId: 'GUEST',
                        username: 'guest',
                        realName: '訪客善信',
                        role: 'GUEST'
                    }));
                    window.location.replace('index.html');
                };

                // 保留：測試身分快速登入
                const quickLogin = (role, realName, uname) => {
                    localStorage.setItem('temple_token', `test-token-${role.toLowerCase()}`);
                    localStorage.setItem('temple_user', JSON.stringify({
                        userId: `TEST-${role}`,
                        username: uname,
                        realName: realName,
                        role: role
                    }));
                    window.location.replace('index.html');
                };

                return {
                    username,
                    password,
                    errorMessage,
                    isLoading,
                    handleLogin,
                    loginAsGuest,
                    quickLogin
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
